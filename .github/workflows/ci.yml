name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android unit tests
        working-directory: Android App
        run: bash gradlew testDebugUnitTest

  zepp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ZEPP App/package-lock.json
      - name: Install dependencies
        working-directory: ZEPP App
        run: npm ci
      - name: Run Zepp tests
        working-directory: ZEPP App
        run: npm test
